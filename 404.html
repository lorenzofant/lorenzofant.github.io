<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1">
  <title>404 — Lorenzo Fant</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/jelly.png">
  <link rel="stylesheet" href="/dist/site.css">
  <script>if(localStorage.getItem('dark')==='1')document.documentElement.classList.add('dark');</script>
  <style>
    .error-block {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 4rem 1rem;
      font-size: 0.95rem;
      line-height: 1.78;
      color: var(--text);
    }
    .error-block h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>

<nav class="proto-nav" role="navigation" aria-label="Main navigation">
  <div class="nav-inner">
    <a class="nav-logo" href="https://lorenzofant.github.io">Home</a>
    <div class="nav-links">
      <a href="/research/">Research</a>
      <a href="/publications/">Publications</a>
      <a href="/about/">About</a>
    </div>
    <button class="nav-menu-btn" onclick="toggleNav()" aria-controls="nav-dropdown">Menu</button>
  </div>
</nav>
<div class="nav-dropdown" id="nav-dropdown">
  <a href="/research/">Research</a>
  <a href="/publications/">Publications</a>
  <a href="/about/">About</a>
</div>

<div class="page-outer">
  <div class="error-block">
    <h1>404 — Page not found</h1>
    <p>This page doesn't exist. Go back to the <a href="https://lorenzofant.github.io">home page</a>.</p>
  </div>
</div>

<footer id="footer" role="contentinfo">
  <div class="footer-inner">
    <span class="footer-copy">&copy; 2026</span>
  </div>
</footer>

<script>
  function toggleNav() {
    document.getElementById('nav-dropdown').classList.toggle('open');
  }
  window.addEventListener('click', function(e) {
    if (!e.target.closest('.nav-menu-btn') && !e.target.closest('#nav-dropdown')) {
      document.getElementById('nav-dropdown').classList.remove('open');
    }
  });
</script>
</body>
</html>
